<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create an account on {{WEBSITE_NAME}} — get started with SMS activations and virtual numbers.">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Register — {{WEBSITE_NAME}}">
  <meta property="og:description" content="Create an account to use SMS activation and virtual number rental.">
  <title>Register — {{WEBSITE_NAME}}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div id="notification-banner" class="notification-banner" style="display:none" role="alert"></div>
  <header class="site-header auth-header">
    <a href="/" class="logo">{{WEBSITE_NAME}}</a>
    <nav class="nav-links"><a href="/login">Login</a> <span id="headerNavLinks" style="display:none;"><a href="/">Site list</a> <a href="/active">Active numbers</a></span></nav>
  </header>
  <main class="auth-main">
    <div class="auth-box auth-box-wide">
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Get started with SMS activations</p>
      <form id="form" class="auth-form">
        <div class="auth-form-row">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
          </div>
        </div>
        <div class="auth-form-row">
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6" placeholder="At least 6 characters">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="Repeat password">
          </div>
        </div>
        <div class="auth-form-section">
          <span class="auth-section-label">Contact (optional)</span>
          <div class="auth-form-row">
            <div class="form-group">
              <label for="whatsapp">WhatsApp</label>
              <input type="text" id="whatsapp" name="whatsapp" placeholder="Phone or username">
            </div>
            <div class="form-group">
              <label for="telegram">Telegram</label>
              <input type="text" id="telegram" name="telegram" placeholder="@username">
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-auth">Create account</button>
      </form>
      <div class="auth-links">
        <a href="/login" class="auth-link">Already have an account? Login</a>
      </div>
    </div>
  </main>
  <script src="/js/toast.js"></script>
  <script src="/js/crisp.js"></script>
  <script>
    if (window.initCrisp) window.initCrisp();
    fetch('/api/notification').then(r => r.ok ? r.json() : {}).then(d => {
      if (d.enabled && d.text) {
        const b = document.getElementById('notification-banner');
        if (b) { b.textContent = d.text; b.style.display = 'block'; }
      }
    }).catch(() => {});
  </script>
  <script>
    const form = document.getElementById('form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (form.password.value !== form.confirmPassword.value) {
        toast('Passwords do not match', 'error');
        return;
      }
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const r = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: form.name.value.trim(),
            email: form.email.value,
            password: form.password.value,
            confirmPassword: form.confirmPassword.value,
            whatsapp: form.whatsapp.value.trim(),
            telegram: form.telegram.value.trim(),
          })
        });
        const d = await r.json();
        if (!r.ok) { toast(d.error || 'Registration failed', 'error'); return; }
        toast(d.message || 'Check your email to verify.', 'success');
        window.location.href = '/';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
