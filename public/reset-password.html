<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — {{WEBSITE_NAME}}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div id="notification-banner" class="notification-banner" style="display:none" role="alert"></div>
  <header class="site-header auth-header">
    <a href="/" class="logo">{{WEBSITE_NAME}}</a>
    <nav class="nav-links"><a href="/login">Login</a> <span id="headerNavLinks" style="display:none;"><a href="/">Site list</a> <a href="/active">Active numbers</a></span></nav>
  </header>
  <main class="auth-main">
    <div class="auth-box">
      <h1 class="auth-title">Reset password</h1>
      <div id="noToken" class="auth-message" style="display:none;">
        <p>Invalid or expired link. <a href="/forgot-password" class="auth-link">Request a new one</a>.</p>
      </div>
      <form id="form" class="auth-form" style="display:none;">
        <div class="form-group">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" required minlength="6" placeholder="At least 6 characters">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="Repeat password">
        </div>
        <button type="submit" class="btn btn-primary btn-auth">Reset password</button>
      </form>
      <div class="auth-links">
        <a href="/login" class="auth-link">Back to login</a>
      </div>
    </div>
  </main>
  <script src="/js/toast.js"></script>
  <script src="/js/crisp.js"></script>
  <script>
    if (window.initCrisp) window.initCrisp();
    fetch('/api/notification').then(r => r.ok ? r.json() : {}).then(d => {
      if (d.enabled && d.text) {
        const b = document.getElementById('notification-banner');
        if (b) { b.textContent = d.text; b.style.display = 'block'; }
      }
    }).catch(() => {});
  </script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('form');
    const noToken = document.getElementById('noToken');
    if (!token) {
      noToken.style.display = 'block';
    } else {
      form.style.display = 'block';
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (form.password.value !== form.confirmPassword.value) {
          toast('Passwords do not match', 'error');
          return;
        }
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        try {
          const r = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              token,
              password: form.password.value,
              confirmPassword: form.confirmPassword.value,
            })
          });
          const d = await r.json();
          if (!r.ok) { toast(d.error || 'Failed', 'error'); return; }
          toast(d.message || 'Password updated.', 'success');
          setTimeout(() => { window.location.href = '/login'; }, 1500);
        } finally {
          btn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
