<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset your {{WEBSITE_NAME}} password. Enter your email to receive a reset link.">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Forgot password — {{WEBSITE_NAME}}">
  <meta property="og:description" content="Request a password reset link.">
  <title>Forgot password — {{WEBSITE_NAME}}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div id="notification-banner" class="notification-banner" style="display:none" role="alert"></div>
  <header class="site-header auth-header">
    <a href="/" class="logo">{{WEBSITE_NAME}}</a>
    <nav class="nav-links"><a href="/login">Login</a> <a href="/register">Register</a> <span id="headerNavLinks" style="display:none;"><a href="/">Site list</a> <a href="/active">Active numbers</a></span></nav>
  </header>
  <main class="auth-main">
    <div class="auth-box">
      <h1 class="auth-title">Forgot password</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>
      <form id="form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary btn-auth">Send reset link</button>
      </form>
      <div class="auth-links">
        <a href="/login" class="auth-link">Back to login</a>
      </div>
    </div>
  </main>
  <script src="/js/toast.js"></script>
  <script src="/js/crisp.js"></script>
  <script>
    if (window.initCrisp) window.initCrisp();
    fetch('/api/notification').then(r => r.ok ? r.json() : {}).then(d => {
      if (d.enabled && d.text) {
        const b = document.getElementById('notification-banner');
        if (b) { b.textContent = d.text; b.style.display = 'block'; }
      }
    }).catch(() => {});
  </script>
  <script>
    const form = document.getElementById('form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const r = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.email.value })
        });
        const d = await r.json();
        if (!r.ok) { toast(d.error || 'Failed', 'error'); return; }
        toast(d.message || 'Check your email.', 'success');
        form.reset();
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
