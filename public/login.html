<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to {{WEBSITE_NAME}} — SMS activation and virtual number rental service.">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Login — {{WEBSITE_NAME}}">
  <meta property="og:description" content="Sign in to your account.">
  <title>Login — {{WEBSITE_NAME}}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div id="notification-banner" class="notification-banner" style="display:none" role="alert"></div>
  <header class="site-header auth-header">
    <a href="/" class="logo">{{WEBSITE_NAME}}</a>
    <nav class="nav-links"><span id="headerNavLinks" style="display:none;"><a href="/">Site list</a> <a href="/active">Active numbers</a></span> <a href="/register">Register</a></nav>
  </header>
  <main class="auth-main">
    <div class="auth-box">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account</p>
      <div id="loginError" class="auth-error" style="display:none;"></div>
      <form id="form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-auth">Login</button>
      </form>
      <div class="auth-links">
        <a href="/forgot-password" class="auth-link">Forgot password?</a>
        <span class="auth-divider">·</span>
        <a href="/register" class="auth-link">Create an account</a>
      </div>
    </div>
  </main>
  <script src="/js/toast.js"></script>
  <script src="/js/crisp.js"></script>
  <script>
    if (window.initCrisp) window.initCrisp();
    fetch('/api/notification').then(r => r.ok ? r.json() : {}).then(d => {
      if (d.enabled && d.text) {
        const b = document.getElementById('notification-banner');
        if (b) { b.textContent = d.text; b.style.display = 'block'; }
      }
    }).catch(() => {});
  </script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const err = params.get('error');
    if (err === 'invalid_token') toast('Invalid or expired verification link.', 'error');
    if (err === 'token_expired') toast('Verification link expired. Log in and resend.', 'error');
    if (err === 'suspended') toast('Account suspended. Contact support.', 'error');

    const form = document.getElementById('form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: form.email.value, password: form.password.value })
      });
      const d = await r.json();
      if (!r.ok) { toast(d.error || 'Login failed', 'error'); return; }
      window.location.href = d.redirect || (d.user && d.user.isAdmin ? '/admin' : '/');
    });
  </script>
</body>
</html>
