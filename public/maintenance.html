<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{WEBSITE_NAME}} is currently under maintenance. We'll be back shortly.">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Under maintenance — {{WEBSITE_NAME}}">
  <meta property="og:description" content="We're making things better. We'll be back shortly.">
  <title>Under maintenance — {{WEBSITE_NAME}}</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .maintenance-page .maintenance-hero {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 480px;
      margin: 0 auto;
    }
    .maintenance-page .maintenance-icon-wrap {
      width: 100px;
      height: 100px;
      margin: 0 auto 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, rgba(34, 211, 238, 0.12) 0%, rgba(99, 102, 241, 0.1) 100%);
      border: 1px solid rgba(34, 211, 238, 0.25);
      border-radius: 24px;
      box-shadow: 0 0 40px rgba(34, 211, 238, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      animation: maintenance-pulse 2.5s ease-in-out infinite;
    }
    @keyframes maintenance-pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(34, 211, 238, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.06); opacity: 1; }
      50% { box-shadow: 0 0 55px rgba(34, 211, 238, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.08); opacity: 0.95; }
    }
    .maintenance-page .maintenance-icon {
      width: 52px;
      height: 52px;
      color: var(--primary);
      animation: maintenance-spin 8s linear infinite;
    }
    @keyframes maintenance-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .maintenance-page .maintenance-title {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #e8eaf6 0%, #c5cae9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }
    .maintenance-page .maintenance-subtitle {
      margin: 0 0 1.5rem;
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
    }
    .maintenance-page .maintenance-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.25rem;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.2);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .maintenance-page .maintenance-note svg {
      flex-shrink: 0;
      color: var(--primary);
    }
    .maintenance-page .auth-box {
      padding: 2.5rem 2rem;
    }
  </style>
</head>
<body class="auth-page maintenance-page">
  <header class="site-header auth-header">
    <span class="logo">{{WEBSITE_NAME}}</span>
  </header>
  <main class="auth-main">
    <div class="auth-box">
      <div class="maintenance-hero">
        <div class="maintenance-icon-wrap">
          <svg class="maintenance-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <h1 class="maintenance-title">Under maintenance</h1>
        <p class="maintenance-subtitle">We're making things better. We'll be back shortly.</p>
        <div class="maintenance-note">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span>If you have an access link, open it to continue.</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
